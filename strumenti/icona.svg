<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icona originale "Giappone 2027" in stile anime: tramonto, Fuji, torii e sakura. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2461"/>
      <stop offset=".34" stop-color="#5a2f86"/>
      <stop offset=".58" stop-color="#d1477a"/>
      <stop offset=".78" stop-color="#ff8f5e"/>
      <stop offset="1" stop-color="#ffd59a"/>
    </linearGradient>
    <radialGradient id="alone" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffb36b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c9"/>
      <stop offset="1" stop-color="#ffb259"/>
    </linearGradient>
    <linearGradient id="monte" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b3f9e"/>
      <stop offset=".5" stop-color="#3a2f80"/>
      <stop offset="1" stop-color="#2a2263"/>
    </linearGradient>
    <linearGradient id="neve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f3e9ff"/>
      <stop offset="1" stop-color="#c9b8f0"/>
    </linearGradient>
    <linearGradient id="colle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3f5c"/>
      <stop offset="1" stop-color="#0d2236"/>
    </linearGradient>
    <linearGradient id="colle2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123049"/>
      <stop offset="1" stop-color="#081726"/>
    </linearGradient>
    <clipPath id="disco"><circle cx="256" cy="268" r="92"/></clipPath>
    <g id="fiore">
      <g fill="#ffc6d9">
        <ellipse cx="0" cy="-9" rx="6.5" ry="9"/>
        <ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(72)"/>
        <ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(144)"/>
        <ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(216)"/>
        <ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(288)"/>
      </g>
      <circle r="4.2" fill="#ff7aa5"/>
      <circle r="1.8" fill="#ffe08a"/>
    </g>
    <path id="petalo" d="M0 -7 C5 -5 6 3 0 7 C-6 3 -5 -5 0 -7 Z" fill="#ffd3e2"/>
    <path id="scintilla" d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z" fill="#fff"/>
  </defs>

  <!-- cielo -->
  <rect width="512" height="512" fill="url(#cielo)"/>
  <!-- stelle e scintille -->
  <g fill="#fff">
    <circle cx="70" cy="62" r="1.8" opacity=".8"/><circle cx="150" cy="40" r="1.4" opacity=".7"/>
    <circle cx="392" cy="54" r="1.6" opacity=".8"/><circle cx="452" cy="110" r="1.3" opacity=".6"/>
    <circle cx="330" cy="92" r="1.2" opacity=".6"/><circle cx="214" cy="78" r="1.1" opacity=".5"/>
  </g>
  <use href="#scintilla" transform="translate(420 72) scale(1.1)" opacity=".95"/>
  <use href="#scintilla" transform="translate(300 46) scale(.6)" opacity=".8"/>
  <use href="#scintilla" transform="translate(104 128) scale(.55)" opacity=".7"/>

  <!-- sole con alone e fasce di luce -->
  <circle cx="256" cy="268" r="170" fill="url(#alone)"/>
  <g clip-path="url(#disco)">
    <rect x="150" y="170" width="212" height="200" fill="url(#sole)"/>
    <g fill="#ff9a62" opacity=".55">
      <rect x="150" y="300" width="212" height="5"/>
      <rect x="150" y="315" width="212" height="7"/>
      <rect x="150" y="332" width="212" height="9"/>
      <rect x="150" y="351" width="212" height="12"/>
    </g>
  </g>
  <!-- nuvole sottili -->
  <g fill="#ffd0b0" opacity=".55">
    <rect x="40" y="214" width="150" height="7" rx="3.5"/>
    <rect x="70" y="228" width="96" height="5" rx="2.5"/>
    <rect x="330" y="198" width="140" height="7" rx="3.5"/>
    <rect x="360" y="212" width="80" height="5" rx="2.5"/>
  </g>

  <!-- Fuji -->
  <path d="M-10 412 L196 250 Q256 206 316 250 L522 412 Z" fill="url(#monte)"/>
  <path d="M196 250 Q256 206 316 250 L300 262 L284 252 L270 268 L256 254 L240 270 L226 254 L212 264 Z" fill="url(#neve)"/>
  <path d="M256 222 L246 300 L258 262 Z" fill="#ffffff" opacity=".18"/>

  <!-- colline -->
  <path d="M-10 420 Q90 360 200 400 T420 380 T522 392 L522 522 L-10 522 Z" fill="url(#colle)"/>
  <path d="M-10 460 Q110 420 230 452 T522 436 L522 522 L-10 522 Z" fill="url(#colle2)"/>

  <!-- torii -->
  <g transform="translate(336 352) scale(.92)">
    <rect x="-6" y="0" width="12" height="96" fill="#e03b35"/>
    <rect x="58" y="0" width="12" height="96" fill="#e03b35"/>
    <rect x="-8" y="88" width="16" height="10" fill="#2a1418"/>
    <rect x="56" y="88" width="16" height="10" fill="#2a1418"/>
    <rect x="-12" y="22" width="88" height="9" fill="#e03b35"/>
    <rect x="28" y="14" width="8" height="10" fill="#e03b35"/>
    <path d="M-26 -6 Q32 4 90 -6 L86 6 Q32 14 -22 6 Z" fill="#2a1418"/>
    <path d="M-20 4 Q32 12 84 4 L82 12 Q32 19 -18 12 Z" fill="#e03b35"/>
  </g>

  <!-- ramo di ciliegio -->
  <path d="M-10 70 C40 80 80 96 118 128 C140 146 160 150 186 148" stroke="#3a1f2b" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M60 86 C70 110 66 132 52 150" stroke="#3a1f2b" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M118 128 C126 104 142 92 160 86" stroke="#3a1f2b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <use href="#fiore" transform="translate(30 74) scale(1.15) rotate(10)"/>
  <use href="#fiore" transform="translate(76 96) scale(1.25) rotate(-12)"/>
  <use href="#fiore" transform="translate(54 150) scale(1)"/>
  <use href="#fiore" transform="translate(112 124) scale(1.2) rotate(25)"/>
  <use href="#fiore" transform="translate(162 86) scale(1.05) rotate(-20)"/>
  <use href="#fiore" transform="translate(186 148) scale(1.15) rotate(5)"/>
  <use href="#fiore" transform="translate(140 152) scale(.85) rotate(40)"/>
  <use href="#fiore" transform="translate(10 112) scale(.9) rotate(-30)"/>

  <!-- petali che cadono -->
  <use href="#petalo" transform="translate(230 140) rotate(30)"/>
  <use href="#petalo" transform="translate(300 170) rotate(-40) scale(.9)"/>
  <use href="#petalo" transform="translate(212 196) rotate(70) scale(.8)"/>
  <use href="#petalo" transform="translate(120 230) rotate(-15) scale(.85)"/>
  <use href="#petalo" transform="translate(350 140) rotate(55) scale(.7)"/>
  <use href="#petalo" transform="translate(170 300) rotate(20) scale(.75)" opacity=".9"/>
  <use href="#petalo" transform="translate(330 330) rotate(-60) scale(.8)" opacity=".9"/>
</svg>
