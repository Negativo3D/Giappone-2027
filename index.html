<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giappone 2027</title>
<meta name="theme-color" content="#B8344A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Giappone">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="icon" href="icona-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#F6F1EC; --card:#FFFFFF; --ink:#231C1F; --ink2:#6E6267; --line:#E9DFD9;
    --beni:#B8344A; --beni-soft:#FBE8EB; --matcha:#3E8A6E; --matcha-soft:#E4F2EC;
    --ai:#3B5BA9; --ai-soft:#E7ECF8; --kin:#A0782C; --kin-soft:#F6EEDC;
    --ombra:0 4px 16px rgba(35,28,31,.07);
    --font: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17131A; --card:#221D25; --ink:#F3ECEE; --ink2:#B4A8AE; --line:#3A3240;
      --beni:#E2607A; --beni-soft:#3C2129; --matcha:#5DBB95; --matcha-soft:#1D3229;
      --ai:#8AA4EC; --ai-soft:#222B42; --kin:#D7AE5C; --kin-soft:#3A2F1C;
      --ombra:0 4px 16px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%;
    padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none;padding:0;transition:transform .12s ease}
  button:active{transform:scale(.96)}
  a{color:inherit}
  @keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}

  /* testata */
  .testa{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top)}
  .testa .wrap{display:flex;align-items:center;gap:10px;height:56px}
  .testa h1{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:0;flex:1;display:flex;align-items:center;gap:8px}
  .testa h1 .sole{width:14px;height:14px;border-radius:50%;background:var(--beni);flex:none}
  .pill{font-size:12px;font-weight:650;padding:6px 10px;border-radius:99px;background:var(--card);
    border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
  .pill.ok{color:var(--matcha)} .pill.err{color:var(--beni)}
  .tondo{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:18px}

  /* hero */
  .hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 18px;color:#fff;margin:6px 0 16px;
    background:linear-gradient(140deg,#D9566B 0%,#B8344A 45%,#7E1F37 100%);box-shadow:0 14px 32px rgba(184,52,74,.32)}
  .anim .hero{animation:su .45s ease both}
  .anim .card{animation:su .35s ease both}
  .hero::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);top:-90px;right:-60px}
  .hero>*{position:relative}
  .occhiello{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:.8}
  .hero .grande{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.1;margin-top:4px}
  .hero .sotto{font-size:13.5px;font-weight:600;opacity:.88;margin-top:6px}
  .percorso{display:flex;gap:4px;margin-top:16px}
  .percorso div{flex:var(--n) 1 0;min-width:64px;background:rgba(255,255,255,.18);border-radius:10px;padding:7px 8px}
  .percorso b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .percorso span{font-size:11px;opacity:.85;white-space:nowrap}
  .percorso div.ora{background:#fff;color:var(--beni)}

  /* card e liste */
  .sez{font-size:13px;font-weight:750;color:var(--ink2);text-transform:uppercase;letter-spacing:.8px;margin:22px 4px 10px;
    display:flex;align-items:center;gap:8px}
  .sez .agg{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px;color:var(--beni);font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:10px;
    box-shadow:var(--ombra)}
  .card.piatta{box-shadow:none}
  .riga{display:flex;align-items:center;gap:10px}
  .muto{color:var(--ink2);font-size:13px}
  .piccolo{font-size:12px;color:var(--ink2)}
  .tit{font-weight:750;font-size:15.5px;line-height:1.25}
  .vuoto{text-align:center;color:var(--ink2);font-size:14px;padding:24px 10px}

  .giorno .data{width:50px;flex:none;text-align:center;border-radius:16px;padding:7px 0;background:var(--beni-soft);color:var(--beni)}
  .giorno .data b{display:block;font-size:20px;line-height:1;font-weight:800}
  .giorno .data span{font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.5px}
  .giorno.oggi{border:2px solid var(--beni)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;
    background:var(--ai-soft);color:var(--ai);white-space:nowrap}
  .chip i{width:7px;height:7px;border-radius:50%;background:currentColor;font-style:normal}
  .voci{margin:14px 0 4px;padding:0;list-style:none;border-left:2px solid var(--line);margin-left:8px}
  .voci li{position:relative;padding:0 0 12px 16px}
  .voci li::before{content:'';position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--beni)}
  .voci .ora{font-size:11.5px;font-weight:800;color:var(--beni);text-transform:uppercase;letter-spacing:.4px}
  .voci .testo{font-size:14.5px;line-height:1.42;margin-top:1px}
  .azioni{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .bott{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:12px;
    background:var(--bg);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
  .bott.maps{background:var(--matcha-soft);border-color:transparent;color:var(--matcha)}
  .bott.prim{background:var(--beni);border-color:transparent;color:#fff}
  .bott.pieno{width:100%;justify-content:center;padding:12px;font-size:14.5px;border-radius:16px}
  textarea.nota{width:100%;min-height:62px;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:10px 12px;font-size:14px;resize:vertical;outline:none}
  textarea.nota:focus{border-color:var(--beni)}

  .filtri{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px;scrollbar-width:none}
  .filtri::-webkit-scrollbar{display:none}
  .filtro{flex:none;font-size:13px;font-weight:700;padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
  .filtro.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

  .cuori{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .cuore{font-size:13px;font-weight:750;padding:6px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
  .cuore.on{background:var(--beni-soft);border-color:transparent;color:var(--beni)}
  .stati{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
  .stati button{flex:1;font-size:12.5px;font-weight:700;padding:7px 4px;border-radius:9px;color:var(--ink2)}
  .stati button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .stati button.on.scelto{color:var(--ai)} .stati button.on.prenotato{color:var(--matcha)}
  .avviso{background:var(--kin-soft);color:var(--kin);border-radius:12px;padding:9px 11px;font-size:13px;font-weight:600;line-height:1.4;margin-top:9px}
  .prezzo{font-size:18px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
  .tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.4px}
  .tag.prenotato{background:var(--matcha-soft);color:var(--matcha)} .tag.scelto{background:var(--ai-soft);color:var(--ai)}

  .spunta{width:28px;height:28px;flex:none;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:900;color:#fff;background:var(--card)}
  .spunta.on{background:var(--matcha);border-color:var(--matcha)}
  .fatto .tit{text-decoration:line-through;color:var(--ink2);font-weight:600}
  .scad{font-size:12px;font-weight:700;color:var(--ink2)} .scad.rossa{color:var(--beni)}
  .barra{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .barra i{display:block;height:100%;background:var(--matcha);border-radius:99px}
  .barra i.oltre{background:var(--beni)}
  .tab-num{font-variant-numeric:tabular-nums}

  /* menu in basso */
  .menu{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .menu .wrap{display:flex;padding:0 6px}
  .menu button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:10.5px;font-weight:700;color:var(--ink2)}
  .menu button .em{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
  .menu button.on{color:var(--beni)} .menu button.on .em{filter:none;opacity:1}

  /* foglio modale */
  .velo{position:fixed;inset:0;z-index:50;background:rgba(20,14,18,.45);display:flex;align-items:flex-end;justify-content:center;animation:appare .2s ease}
  @keyframes appare{from{opacity:0}to{opacity:1}}
  .foglio{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;
    padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:sale .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes sale{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .foglio .maniglia{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
  .foglio h2{font-size:20px;font-weight:800;margin:4px 0 14px;display:flex;align-items:center}
  .foglio h2 button{margin-left:auto;font-size:15px;font-weight:700;color:var(--ink2)}
  .campo{display:block;margin-bottom:12px}
  .campo>span{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:0 0 5px 4px}
  .campo input,.campo select,.campo textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:var(--card);
    font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
  .campo textarea{min-height:80px;resize:vertical}
  .campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--beni)}
  .due{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .voce-ed{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:9px}
  .voce-ed .riga input{flex:1;min-width:0}
  .voce-ed input,.voce-ed textarea,.voce-ed select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--bg);font-size:15px;outline:none}
  .voce-ed textarea{min-height:58px;margin-top:7px;resize:vertical}
  .voce-ed select{margin-top:7px}
  .mini{width:34px;height:34px;flex:none;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px}
  .esito{font-size:13px;font-weight:650;margin:8px 4px;line-height:1.4}

  /* blocco */
  .blocco{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
  .blocco .sole{width:84px;height:84px;border-radius:50%;background:var(--beni);margin:0 auto 22px;box-shadow:0 12px 30px rgba(184,52,74,.35)}
  .blocco h1{text-align:center;font-size:30px;margin:0 0 6px;letter-spacing:-.6px}
  .blocco p{text-align:center;color:var(--ink2);margin:0 0 24px;line-height:1.45}
  .blocco input{text-align:center;letter-spacing:2px;text-transform:uppercase}
</style>
</head>

<script>
'use strict';
/* ====================================================================
   Giappone 2027 — app di viaggio condivisa.
   Pagina unica, nessuna dipendenza. I dati del viaggio sono cifrati nel
   file (blocco "seme") e nel cloud (Supabase, stessa tabella di CHO):
   senza il codice del viaggio nessuno li può leggere.
   ==================================================================== */
const VERSIONE = '1.0.0';
const CFG_KEY = 'g27-config', DATI_KEY = 'g27-dati', SEME_KEY = 'g27-seme';
const COLL = ['viaggiatori','tappe','giorni','alloggi','voli','luoghi','todo','budget','spese','info'];
const SEME = (() => { try{ return JSON.parse(document.getElementById('seme').textContent); }catch(e){ return {}; } })();

function leggiJSON(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function scriviJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
let cfg = leggiJSON(CFG_KEY) || {};
let D = leggiJSON(DATI_KEY);
let S = { animProssimo:true, tab:'programma', aperto:null, sheet:null, citta:'tutte', cat:'tutti', soloPref:false,
  sync:{ stato:'', ora:null, errore:'' }, erroreBlocco:'', attesa:false, esitoImp:'' };
function salvaCfg(){ scriviJSON(CFG_KEY, cfg); }
function salvaLocale(){ if(!scriviJSON(DATI_KEY, D)) alert('Memoria del telefono piena: non riesco a salvare.'); }

/* ---------- utilità ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkOk = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
const maps = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const vis = k => ((D && D[k]) || []).filter(x => !x.del);
const trova = (k, id) => vis(k).find(x => x.id === id);
const oggiISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const giorniTra = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const fmtD = (iso, o) => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('it-IT', o || { day:'numeric', month:'long' }) : '';
const eur = n => '€ ' + Math.round(n).toLocaleString('it-IT');
const yen = n => '¥ ' + Math.round(n).toLocaleString('it-IT');
const cambio = () => Number(D.viaggio && D.viaggio.cambio) || 177;
const inEuro = s => s.valuta === 'JPY' ? Number(s.importo || 0) / cambio() : Number(s.importo || 0);
const io = () => cfg.io || '';
const nomeDi = id => { const p = trova('viaggiatori', id); return p ? p.nome : ''; };
const tappa = id => trova('tappe', id) || { citta:'', colore:'#888' };
const tappeNotte = () => vis('tappe').filter(t => !t.solo).sort((a, b) => a.dal.localeCompare(b.dal));

/* ---------- cifratura (stessa ricetta di CHO: PBKDF2 + AES-GCM) ---------- */
function _b64(buf){ const b = new Uint8Array(buf); let s = ''; for(let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function _unb64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function sha256hex(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
const normCodice = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
async function chiave(codice, salt, it){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normCodice(codice)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:it, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function cifra(testo, codice, it){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await chiave(codice, salt, it), new TextEncoder().encode(testo));
  return { v:1, it, salt:_b64(salt), iv:_b64(iv), ct:_b64(ct) };
}
async function decifra(o, codice){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:_unb64(o.iv) }, await chiave(codice, _unb64(o.salt), o.it || 100000), _unb64(o.ct));
  return new TextDecoder().decode(pt);
}

/* ---------- unione dei dati: per ogni elemento vince la modifica più recente ---------- */
function unisci(a, b){
  if(!a) return JSON.parse(JSON.stringify(b));
  if(!b) return a;
  const r = { viaggio: ((b.viaggio && b.viaggio.agg) || 0) > ((a.viaggio && a.viaggio.agg) || 0) ? b.viaggio : a.viaggio };
  for(const k of COLL){
    const m = new Map();
    for(const x of (a[k] || [])) m.set(x.id, x);
    for(const x of (b[k] || [])){ const y = m.get(x.id); if(!y || (x.agg || 0) > (y.agg || 0)) m.set(x.id, x); }
    r[k] = [...m.values()];
  }
  return r;
}
function firma(x){
  if(!x) return '';
  return ((x.viaggio && x.viaggio.agg) || 0) + '|' + COLL.map(k => (x[k] || []).map(r => r.id + ':' + (r.agg || 0)).sort().join(',')).join('|');
}
function salva(k, rec){
  rec.agg = Date.now(); rec.da = io();
  if(k === 'viaggio'){ D.viaggio = rec; }
  else{ const arr = D[k] || (D[k] = []); const i = arr.findIndex(x => x.id === rec.id); if(i >= 0) arr[i] = rec; else arr.push(rec); }
  salvaLocale(); pianificaSync();
}
function elimina(k, id){ const r = (D[k] || []).find(x => x.id === id); if(r){ salva(k, { id:r.id, del:true }); } }

/* ---------- seme cifrato contenuto nella pagina ---------- */
async function applicaSeme(codice){
  if(!SEME.ct) throw new Error('nessun dato nella pagina');
  const h = await sha256hex(SEME.ct + '|' + normCodice(codice));
  if(D && localStorage.getItem(SEME_KEY) === h) return;
  const seme = JSON.parse(await decifra(SEME, codice));
  D = unisci(D, seme); salvaLocale();
  try{ localStorage.setItem(SEME_KEY, h); }catch(e){}
}

/* ---------- sincronizzazione con Supabase ---------- */
let syncTimer = null, inSync = false, ancoraSync = false;
function pianificaSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(syncOra, 1500); aggiornaPill(); }
function syncAttiva(){ return !!(cfg.url && cfg.key && cfg.codice); }
async function syncOra(manuale){
  if(!syncAttiva()){ S.sync = { stato:'locale' }; aggiornaPill(); return; }
  if(inSync){ ancoraSync = true; return; }
  inSync = true; S.sync = { ...S.sync, stato:'corso' }; aggiornaPill();
  const base = cfg.url.trim().replace(/\/+$/, '') + '/rest/v1/' + (cfg.tabella || 'cho_sync');
  try{
    const id = await sha256hex('giappone-2027|' + normCodice(cfg.codice));
    const h = { apikey:cfg.key, Authorization:'Bearer ' + cfg.key };
    const r = await fetch(base + '?select=dati&codice=eq.' + id, { headers:h, cache:'no-store' });
    if(!r.ok) throw new Error('lettura non riuscita (' + r.status + ') ' + (await r.text()).slice(0, 140));
    const arr = await r.json();
    let remoto = null;
    if(arr.length){
      try{ remoto = JSON.parse(await decifra(JSON.parse(arr[0].dati), cfg.codice)); }
      catch(e){ throw new Error('i dati nel cloud non si aprono con questo codice'); }
    }
    const prima = firma(D);
    D = unisci(D, remoto); salvaLocale();
    if(!remoto || firma(D) !== firma(remoto)){
      const bundle = JSON.stringify(await cifra(JSON.stringify(D), cfg.codice, 150000));
      const p = await fetch(base, { method:'POST', headers:{ ...h, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify([{ codice:id, dati:bundle, aggiornato:new Date().toISOString() }]) });
      if(!p.ok) throw new Error('invio non riuscito (' + p.status + ') ' + (await p.text()).slice(0, 140));
    }
    S.sync = { stato:'ok', ora:Date.now() };
    if(prima !== firma(D)) renderSicuro(); else aggiornaPill();
  }catch(e){
    S.sync = { stato:'errore', errore:(e && e.message) || String(e) };
    aggiornaPill();
    if(manuale) S.esitoImp = 'Sincronizzazione non riuscita: ' + S.sync.errore;
  }finally{
    inSync = false;
    if(ancoraSync){ ancoraSync = false; setTimeout(syncOra, 400); }
    if(manuale && S.sheet && S.sheet.tipo === 'impostazioni') render();
  }
}
function pillHTML(){
  const s = S.sync;
  if(!syncAttiva()) return '<button class="pill" data-a="impostazioni">Solo su questo telefono</button>';
  if(s.stato === 'corso' || syncTimer && !s.ora) return '<span class="pill">Sincronizzo…</span>';
  if(s.stato === 'errore') return '<button class="pill err" data-a="impostazioni">Non sincronizzato</button>';
  if(s.ora) return '<button class="pill ok" data-a="sync">✓ ' + new Date(s.ora).toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' }) + '</button>';
  return '<span class="pill">…</span>';
}
function aggiornaPill(){ const el = document.getElementById('pill'); if(el) el.innerHTML = pillHTML(); }
function renderSicuro(){
  const a = document.activeElement;
  if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ aggiornaPill(); S.renderInSospeso = true; return; }
  render();
}

/* ---------- invito: #c=CODICE&u=URL&k=CHIAVE&t=TABELLA ---------- */
function leggiInvito(){
  if(!location.hash || location.hash.length < 4) return;
  const p = new URLSearchParams(location.hash.slice(1));
  if(p.get('c')){
    cfg.codice = normCodice(p.get('c'));
    if(p.get('u')) cfg.url = p.get('u');
    if(p.get('k')) cfg.key = p.get('k');
    if(p.get('t')) cfg.tabella = p.get('t');
    salvaCfg();
  }
  history.replaceState(null, '', location.pathname + location.search);
}
function linkInvito(){
  const p = new URLSearchParams({ c:cfg.codice });
  if(cfg.url && cfg.key){ p.set('u', cfg.url); p.set('k', cfg.key); if(cfg.tabella && cfg.tabella !== 'cho_sync') p.set('t', cfg.tabella); }
  return location.origin + location.pathname + '#' + p.toString();
}

/* ---------- da fare ---------- */
function rigaTodo(t){
  const oggi = oggiISO(), n = t.entro ? giorniTra(oggi, t.entro) : null;
  const quando = t.fatto ? (t.da && nomeDi(t.da) ? 'Fatto da ' + esc(nomeDi(t.da)) : 'Fatto') :
    n == null ? '' : n < 0 ? 'Scaduto il ' + fmtD(t.entro) : n === 0 ? 'Entro oggi' : 'Entro il ' + fmtD(t.entro) + (n <= 30 ? ' · tra ' + n + ' g' : '');

    <button class="spunta ${t.fatto ? 'on' : ''}" data-a="todo" data-id="${t.id}">${t.fatto ? '✓' : ''}</button>
    <div style="flex:1;min-width:0"><div class="tit" style="font-size:15px">${esc(t.testo)}</div>

/* ---------- spese ---------- */
function previstoAlloggi(){
  let tot = 0, stima = false;
  for(const t of tappeNotte()){
    const opz = vis('alloggi').filter(h => h.tappa === t.id && h.prezzo);
    const s = alloggioDiTappa(t.id);
    if(s && s.prezzo) tot += Number(s.prezzo);
    else if(opz.length){ tot += Math.min(...opz.map(h => Number(h.prezzo))); stima = true; }
  }
  return { tot, stima };
}

        <div class="barra" style="margin-top:9px"><i class="${s > p && p ? 'oltre' : ''}" style="width:${pc}%"></i></div>

function campoHTML(c, val){
  const v = esc(val == null ? '' : val), n = `name="${c.k}"`, req = c.req ? 'required' : '';
  let input;
  if(c.t === 'sel') input = `<select ${n}>${c.o().map(([k, t]) => `<option value="${esc(k)}" ${String(val) === String(k) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  else if(c.t === 'area') input = `<textarea ${n} ${req}>${v}</textarea>`;
  else input = `<input ${n} ${req} ${c.ph ? `placeholder="${esc(c.ph)}"` : ''} type="${{ num:'number', date:'date', dt:'datetime-local', url:'url' }[c.t] || 'text'}" ${c.t === 'num' ? 'step="any" inputmode="decimal"' : ''} value="${v}">`;
  return `<label class="campo"><span>${esc(c.l)}</span>${input}</label>`;
}

/* =========================== AZIONI =========================== */
const A = {
  tab(d){ S.tab = d.v; S.animProssimo = true; render(); window.scrollTo(0, 0); },
  sync(){ syncOra(true); },
  async sblocca(){
    const c = normCodice(document.getElementById('codice-in').value);
    if(c.length < 8){ S.erroreBlocco = 'Il codice è troppo corto.'; render(); return; }
    S.attesa = true; S.erroreBlocco = ''; render();
    try{ await applicaSeme(c); cfg.codice = c; salvaCfg(); S.attesa = false; render(); syncOra(); if(!io()) A.impostazioni(); }
    catch(e){ S.attesa = false; S.erroreBlocco = 'Codice non corretto.'; render(); }
  },
  apriGiorno(d){ S.aperto = S.aperto === d.id ? '' : d.id; render(); },
  filtro(d){ S[d.f] = d.v; render(); },
  soloPref(){ S.soloPref = !S.soloPref; render(); },
  pref(d){
    if(!io()){ alert('Prima scegli chi sei nelle impostazioni.'); A.impostazioni(); return; }
    const r = JSON.parse(JSON.stringify(trova(d.k, d.id))); r.pref = r.pref || {}; r.pref[io()] = !r.pref[io()];
    salva(d.k, r); render();
  },
  visto(d){ const r = { ...trova('luoghi', d.id) }; r.visto = !r.visto; salva('luoghi', r); render(); },
  todo(d){ const r = { ...trova('todo', d.id) }; r.fatto = !r.fatto; salva('todo', r); render(); },
  statoH(d){ const r = { ...trova('alloggi', d.id) }; r.stato = d.v; salva('alloggi', r); render(); },
  nuovo(d){
    const base = d.k === 'spese' ? { valuta: oggiISO() >= D.viaggio.partenza ? 'JPY' : 'EUR', data: oggiISO(), chi: io(), cat: (vis('budget')[1] || {}).id }
      : d.k === 'luoghi' ? { tappa: S.citta !== 'tutte' ? S.citta : '', cat: S.cat !== 'tutti' ? S.cat : 'vedere' } : {};
    S.sheet = { k:d.k, base }; render();
  },
  mod(d){ S.sheet = { k:d.k, id:d.id }; render(); },
  chiudi(){ S.sheet = null; S.esitoImp = ''; render(); },
  sfondo(d, e){ if(e.target.classList.contains('velo')) A.chiudi(); },
  salvaModulo(){
    const f = document.getElementById('modulo'); if(!f.reportValidity()) return;
    const sh = S.sheet, sc = SCHEMI[sh.k], rec = sh.id ? { ...trova(sh.k, sh.id) } : { id: uid(sh.k[0]) };
    for(const c of sc.campi){ let v = f.elements[c.k].value.trim(); if(c.t === 'num') v = v === '' ? '' : Number(v.replace(',', '.')); rec[c.k] = v; }
    if(sh.k === 'luoghi' && !rec.q) rec.q = rec.nome + ' ' + tappa(rec.tappa).citta;
    if(sh.k === 'todo' && rec.fatto == null) rec.fatto = false;
    salva(sh.k, rec); S.sheet = null; render();
  },
  eliminaModulo(){ if(!confirm('Eliminare per tutti?')) return; elimina(S.sheet.k, S.sheet.id); S.sheet = null; render(); },
  modGiorno(d){ const g = trova('giorni', d.id); S.sheet = { tipo:'giorno', id:d.id, bozza: JSON.parse(JSON.stringify({ ...g, voci: g.voci || [] })) }; render(); },
  nuovoGiorno(){
    const ult = vis('giorni').map(g => g.data).sort().pop() || D.viaggio.partenza;
    const data = new Date(Date.parse(ult + 'T12:00:00') + 864e5).toISOString().slice(0, 10);
    S.sheet = { tipo:'giorno', bozza:{ data, tappa:(tappaDellaNotte(ult) || {}).id || '', titolo:'', voci:[{ ora:'', t:'' }], note:'' } }; render();
  },
  voceNuova(){ S.sheet.bozza.voci.push({ ora:'', t:'' }); render(); },
  voceVia(d){ S.sheet.bozza.voci.splice(+d.i, 1); render(); },
  voceSu(d){ const v = S.sheet.bozza.voci, i = +d.i; if(i > 0){ [v[i - 1], v[i]] = [v[i], v[i - 1]]; render(); } },
  salvaGiorno(){
    const b = S.sheet.bozza; if(!b.titolo.trim()){ alert('Scrivi un titolo.'); return; }
    b.voci = b.voci.filter(v => (v.t || '').trim()).map(v => { const o = { ora:(v.ora || '').trim(), t:v.t.trim() }; if(v.l) o.l = v.l; if(linkOk(v.u)) o.u = linkOk(v.u); return o; });
    if(!b.id) b.id = uid('g');
    salva('giorni', b); S.sheet = null; S.aperto = b.id; render();
  },
  eliminaGiorno(){ if(!confirm('Eliminare questo giorno per tutti?')) return; elimina('giorni', S.sheet.id); S.sheet = null; render(); },
  impostazioni(){ S.sheet = { tipo:'impostazioni' }; S.esitoImp = ''; render(); },
  nuovoViaggiatore(){ salva('viaggiatori', { id: uid('p'), nome:'Nuovo viaggiatore' }); render(); },
  syncManuale(){ if(!syncAttiva()){ S.esitoImp = 'Inserisci Project URL e chiave anon di Supabase.'; render(); return; } S.esitoImp = 'Sincronizzo…'; render();
    syncOra(true).then(() => { if(S.sync.stato === 'ok'){ S.esitoImp = '✓ Sincronizzato alle ' + new Date().toLocaleTimeString('it-IT'); render(); } }); },
  async invita(){
    const url = linkInvito();
    const testo = 'Ecco l’app del nostro viaggio in Giappone. Aprila dal telefono e aggiungila alla schermata Home: ' + url;
    if(!syncAttiva()) S.esitoImp = 'Attenzione: senza Supabase configurato i compagni vedono il programma ma non le modifiche degli altri.';
    try{ if(navigator.share){ await navigator.share({ title:'Giappone 2027', text:testo }); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
    try{ await navigator.clipboard.writeText(url); S.esitoImp = '✓ Link copiato: incollalo in un messaggio privato.'; }
    catch(e){ prompt('Copia questo link:', url); }
    render();
  },
  esporta(){
    const blob = new Blob([JSON.stringify({ app:'giappone-2027', versione:VERSIONE, dati:D }, null, 1)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'giappone-2027-' + oggiISO() + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  importa(){
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = () => { const f = inp.files[0]; if(!f) return; f.text().then(t => {
      try{ const o = JSON.parse(t); if(o.app !== 'giappone-2027' || !o.dati) throw 0; D = unisci(D, o.dati); salvaLocale(); pianificaSync(); S.esitoImp = '✓ Copia importata e unita ai dati.'; render(); }
      catch(e){ alert('Il file non è una copia di questa app.'); } }); };
    inp.click();
  },
  esci(){
    if(!confirm('Cancellare i dati del viaggio da questo telefono? Restano nel cloud e negli altri telefoni.')) return;
    [CFG_KEY, DATI_KEY, SEME_KEY].forEach(k => localStorage.removeItem(k));
    cfg = {}; D = null; S.sheet = null; render();
  },
  csv(){
    const q = s => '"' + String(s || '').replace(/"/g, '""') + '"';
    const righe = [['Nome','Indirizzo','Città','Tipo','Note','Sito']].concat(vis('luoghi').map(l =>
      [l.nome, l.q || l.nome, tappa(l.tappa).citta, (CAT[l.cat] || CAT.altro)[1], l.note, l.link]));
    const blob = new Blob(['﻿' + righe.map(r => r.map(q).join(',')).join('\n')], { type:'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'luoghi-giappone-2027.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  if(b.dataset.a === 'sfondo' && b !== e.target) return;
  const f = A[b.dataset.a]; if(f){ e.preventDefault(); f(b.dataset, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.bz && S.sheet && S.sheet.bozza){
    const p = el.dataset.bz.split('.'); let o = S.sheet.bozza;
    while(p.length > 1) o = o[p.shift()];
    o[p[0]] = el.value;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.ed){
    const [k, id, campo] = el.dataset.ed.split('|');
    let v = el.value; if(el.type === 'number') v = Number(v) || '';
    if(k === 'viaggio'){ salva('viaggio', { ...D.viaggio, [campo]: v }); }
    else{ const r = trova(k, id); if(r && r[campo] !== v) salva(k, { ...r, [campo]: v }); }
    if(S.sheet) render();
  }
  if(el.dataset.cfg){
    cfg[el.dataset.cfg] = el.value.trim(); salvaCfg();
    if(el.dataset.cfg === 'io') render();
  }
});
document.addEventListener('focusout', () => setTimeout(() => {
  const a = document.activeElement;
  if(S.renderInSospeso && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) render();
}, 50));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && cfg.codice && D) syncOra(); });
setInterval(() => { if(document.visibilityState === 'visible' && cfg.codice && D && !inSync) syncOra(); }, 60000);

(async function avvio(){
  leggiInvito();
  if(cfg.codice){
    try{ await applicaSeme(cfg.codice); }
    catch(e){ if(!D){ S.erroreBlocco = 'Il codice salvato non apre i dati: inseriscilo di nuovo.'; cfg.codice = ''; salvaCfg(); } }
  }
  render();
  if(cfg.codice && D){ syncOra(); if(!io()) A.impostazioni(); }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
