<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giappone 2027</title>
<meta name="theme-color" content="#eef4f9">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Giappone">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" sizes="180x180" href="icona-180.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icona-192.png?v=3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Stile Odoo, versione grande e ariosa: sempre chiaro, testi leggibili,
     poche informazioni per schermata, dettagli in una scheda a parte. */
  :root{
    color-scheme:light;
    --bg:#eef4f9; --surface:#ffffff; --surface-2:#f4f8fc; --sunken:#e7eef6;
    --line:#e4ebf3; --line-2:#eef2f7; --ink:#132133; --muted:#4f5f75; --faint:#8494a8;
    --teal:#0f8f9a; --teal-2:#0c6f79; --teal-soft:#dcf1f3;
    --c-blue:#2f77d6; --c-orange:#e07a1a; --c-purple:#7c3aed; --c-red:#dc2626; --c-green:#2e9e5b; --c-cyan:#0891b2; --c-amber:#d69412;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --disp:"Archivo",var(--sans); --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
    --shadow:0 1px 2px rgba(19,33,51,.04),0 8px 24px rgba(19,33,51,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit;transition:transform .12s ease}
  button:active{transform:scale(.98)}
  a{color:inherit}
  svg:not(:where(.leaflet-zoom-animated)){width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  @keyframes su{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .anim>*{animation:su .3s ease both}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px}

  /* barra in alto */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(238,244,249,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .topbar .wrap{display:flex;align-items:center;gap:12px;height:62px}
  .dot{width:38px;height:38px;border-radius:11px;flex:none;background:#2a2263 url(icona-180.png) center/cover;box-shadow:0 1px 3px rgba(19,33,51,.18)}
  .brand{flex:1;min-width:0;font-family:var(--disp);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
  .stato-sync{width:12px;height:12px;border-radius:50%;background:var(--faint);flex:none}
  .stato-sync.ok{background:var(--c-green)} .stato-sync.err{background:var(--c-red)} .stato-sync.corso{background:var(--c-amber)}
  .iconbtn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none;font-size:1.3rem}

  /* intestazioni */
  .titolo{font-family:var(--disp);font-weight:800;font-size:1.75rem;letter-spacing:-.02em;margin:22px 0 4px;line-height:1.15}
  .sottotitolo{color:var(--muted);margin:0 0 18px;font-size:1rem}
  .sec{font-family:var(--disp);font-weight:700;font-size:1.2rem;margin:30px 2px 12px;display:flex;align-items:center;gap:10px}
  .sec .agg{margin-left:auto;font-family:var(--sans);font-size:.95rem;font-weight:600;color:var(--teal-2);display:inline-flex;align-items:center;gap:6px;padding:8px 4px}

  /* scheda grande in testa */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow)}
  .hero .grande{font-family:var(--disp);font-weight:800;font-size:2.1rem;line-height:1.1;letter-spacing:-.02em}
  .hero .grande b{color:var(--teal)}
  .hero .sotto{color:var(--muted);margin-top:6px;font-size:1rem}
  .orologi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .quadrante{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:10px 10px 12px;text-align:center}
  .q-nome{font-family:var(--disp);font-weight:800;font-size:1rem;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:7px}
  .q-nome::before{content:"";width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
  .quadrante.it .q-nome::before{background:linear-gradient(90deg,#009246 33%,#fff 33% 66%,#ce2b37 66%)}
  .quadrante.jp .q-nome::before{background:radial-gradient(circle,#bc002d 0 42%,#fff 46%)}
  .q-schermo{background:linear-gradient(180deg,#16303d,#0f2430);border-radius:13px;padding:14px 4px 12px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 1px 0 #fff;display:flex;justify-content:center}
  .q-ora{white-space:nowrap;font-family:var(--disp);font-weight:800;font-size:clamp(1.8rem,10.4vw,2.6rem);line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;
    color:#8ff5ea;text-shadow:0 0 10px rgba(80,230,215,.55)}
  .q-ora b{font-weight:800}
  .q-punti{font-style:normal;display:inline-block;margin:0 1px;position:relative;top:-.06em}
  .quadrante.jp .q-ora{color:#ffc9a3;text-shadow:0 0 10px rgba(255,150,100,.5)}
  .q-giorno{margin-top:8px;color:var(--muted);font-size:.92rem;text-transform:capitalize}
  .tappe{display:flex;gap:6px;margin-top:18px}
  .tappe div{flex:1 1 0;min-width:0;border-radius:10px;padding:8px 9px;background:color-mix(in srgb,var(--c) 13%,var(--surface))}
  .tappe b{display:block;font-size:.88rem;color:color-mix(in srgb,var(--c) 75%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tappe span{font-size:.78rem;color:var(--muted);white-space:nowrap}

  /* righe grandi (elenco) */
  .riga{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);text-align:left;text-decoration:none;color:inherit}
  .riga.oggi{border:2px solid var(--teal)}
  .ic{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:15px;font-size:1.45rem;
    background:color-mix(in srgb,var(--c,var(--teal)) 14%,var(--surface));color:var(--c,var(--teal))}
  .ic.data{flex-direction:column;line-height:1}
  .ic.data b{font-family:var(--disp);font-size:1.3rem;font-weight:800}
  .ic.data i{font-style:normal;font-size:.7rem;font-weight:700;text-transform:uppercase;margin-top:3px}
  .riga .testo{flex:1;min-width:0}
  .riga .nome{font-weight:700;font-size:1.05rem;line-height:1.3}
  .riga .info{font-size:.9rem;color:var(--muted);margin-top:2px}
  .riga .vai{color:var(--faint);font-size:1.3rem}
  .riga.fatto .nome{text-decoration:line-through;color:var(--faint);font-weight:600}

  .badge{display:inline-block;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;margin-top:6px;
    background:color-mix(in srgb,var(--c,var(--teal)) 14%,var(--surface));color:color-mix(in srgb,var(--c,var(--teal)) 80%,var(--ink))}
  .badge.prenotato{--c:var(--c-green)} .badge.scelto{--c:var(--c-blue)} .badge.giallo{--c:var(--c-amber)} .badge.rosso{--c:var(--c-red)}
  .prezzo{font-family:var(--disp);font-weight:800;font-size:1.15rem;white-space:nowrap;text-align:right}

  /* pulsanti */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;white-space:nowrap;padding:10px 16px;border-radius:14px;font-size:1rem;font-weight:600;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn.maps{background:var(--teal-soft);border-color:transparent;color:var(--teal-2)}
  .btn.danger{color:var(--c-red)}
  .btn.full{width:100%}
  .btn svg{font-size:1.2rem}
  .bottoni{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .bottoni .full2{grid-column:1/-1}
  .cuore{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:52px;height:48px;padding:0 12px;border-radius:14px;
    border:1px solid var(--line);background:var(--surface);color:var(--faint);font-weight:700;font-size:1rem;flex:none}
  .cuore svg{font-size:1.35rem}
  .cuore.on{color:var(--c-red);border-color:color-mix(in srgb,var(--c-red) 30%,var(--line));background:color-mix(in srgb,var(--c-red) 8%,var(--surface))}
  .cuore.on svg{fill:currentColor}
  .altre{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:16px;border:1.5px dashed #c9d6e3;
    color:var(--teal-2);font-weight:600;font-size:.98rem;margin-bottom:10px}

  /* filtri */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;font-size:.98rem;font-weight:600;padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);
    display:inline-flex;align-items:center;gap:6px}
  .chips button.on{background:var(--teal);border-color:var(--teal);color:#fff}

  /* da fare */
  .spunta{width:34px;height:34px;flex:none;border-radius:10px;border:2px solid #c9d6e3;background:var(--surface);display:grid;place-items:center;color:#fff;font-size:1.1rem}
  .spunta.on{background:var(--c-green);border-color:var(--c-green)}
  .scad{font-size:.88rem;color:var(--muted);margin-top:3px} .scad.rossa{color:var(--c-red);font-weight:600}
  .barra{height:10px;border-radius:99px;background:var(--sunken);overflow:hidden}
  .barra i{display:block;height:100%;background:var(--teal);border-radius:99px}
  .barra i.oltre{background:var(--c-red)}
  .num{font-variant-numeric:tabular-nums}
  .vuoto{text-align:center;color:var(--faint);padding:24px 10px}
  .nota-pie{font-size:.88rem;color:var(--muted);line-height:1.5;margin:10px 2px 0}

  /* menu in basso */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar .wrap{display:flex;padding:0 4px}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;font-size:.78rem;font-weight:600;color:var(--faint);text-align:center}
  .tabbar button svg{font-size:1.6rem}
  .tabbar button.on{color:var(--teal-2)}
  .tabbar button.on svg{stroke-width:2.3}

  /* scheda di dettaglio / modulo */
  .velo{position:fixed;inset:0;z-index:50;background:rgba(10,20,32,.4);display:flex;align-items:flex-end;justify-content:center;animation:appare .18s ease}
  @keyframes appare{from{opacity:0}to{opacity:1}}
  .foglio{width:100%;max-width:680px;max-height:94vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;
    padding:0 18px calc(24px + env(safe-area-inset-bottom));animation:sale .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes sale{from{transform:translateY(30px)}to{transform:none}}
  .foglio-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:12px;padding:16px 0 12px;z-index:2}
  .foglio-h h2{font-family:var(--disp);font-weight:800;font-size:1.35rem;margin:0;flex:1;line-height:1.2}
  .blocco{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .blocco p{margin:0;line-height:1.55}
  .etichetta{font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:4px}
  .avviso{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;margin-bottom:12px;line-height:1.5;
    background:#fdf4e2;color:#7a5410;border:1px solid #f1dcae}
  .avviso svg{font-size:1.3rem;margin-top:2px}
  .stati{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
  .stati button{flex:1;font-size:.98rem;font-weight:600;padding:13px 4px;color:var(--muted);border-left:1px solid var(--line);text-align:center}
  .stati button:first-child{border-left:0}
  .stati button.on{background:var(--teal);color:#fff}
  .stati button.on.scelto{background:var(--c-blue)} .stati button.on.prenotato{background:var(--c-green)}
  .attivita{list-style:none;margin:0;padding:0}
  .attivita li{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
  .attivita .ora{font-weight:700;color:var(--teal-2);font-size:.95rem;margin-bottom:2px}
  .attivita .cosa{line-height:1.5}
  .attivita .link{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .attivita .link .btn{min-height:42px;font-size:.95rem;padding:8px 14px}
  textarea.nota{width:100%;min-height:90px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:12px 14px;font-size:1rem;resize:vertical;outline:none}
  textarea.nota:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}

  .campo{display:block;margin-bottom:14px}
  .campo>span{display:block;font-size:.92rem;font-weight:600;margin:0 0 6px 2px}
  .campo input,.campo select,.campo textarea,.voce-ed input,.voce-ed select,.voce-ed textarea{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:12px;
    background:var(--surface);font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
  .campo textarea{min-height:90px;resize:vertical}
  .campo input:focus,.campo select:focus,.campo textarea:focus,.voce-ed input:focus,.voce-ed select:focus,.voce-ed textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
  .due{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .voce-ed{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
  .voce-ed .riga-ed{display:flex;gap:8px;align-items:center}
  .voce-ed textarea{min-height:70px;margin-top:8px;resize:vertical}
  .voce-ed select,.voce-ed .link{margin-top:8px}
  .mini{width:46px;height:46px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);font-size:1.15rem}
  .esito{font-size:.95rem;font-weight:600;margin:10px 2px;line-height:1.45;color:var(--teal-2)}

  /* accesso */
  .accesso{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px}
  .accesso .scheda{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px 20px}
  .accesso .dot{display:block;width:84px;height:84px;border-radius:22px;margin-bottom:18px}
  .accesso input{text-align:center;letter-spacing:.12em;text-transform:uppercase;font-size:20px}



  /* mappa a tutto schermo nella scheda Luoghi */
  #mappa-box{position:fixed;left:0;right:0;top:calc(63px + env(safe-area-inset-top));height:48vh;z-index:15;background:#e9eef3;border-bottom:1px solid var(--line);box-shadow:0 6px 16px rgba(19,33,51,.08)}
  #mappa{position:absolute;inset:0}
  #mappa-filtri{position:absolute;top:10px;left:10px;right:10px;z-index:500;padding:0}
  #mappa-filtri button{box-shadow:0 2px 10px rgba(19,33,51,.18);border-color:transparent}
  #mappa-piu{position:absolute;right:14px;bottom:18px;z-index:500;width:60px;height:60px;border-radius:20px;background:var(--teal);color:#fff;
    display:grid;place-items:center;font-size:1.7rem;box-shadow:0 6px 18px rgba(15,143,154,.45)}
  #mappa-aiuto{position:absolute;left:10px;right:10px;bottom:18px;z-index:600;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;
    display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  #mappa-aiuto[hidden],#mappa-piu[hidden]{display:none}
  #mappa-aiuto span{flex:1} #mappa-aiuto button{color:#7fe3ea;font-weight:700;padding:8px}
  main.con-mappa{padding-top:calc(48vh + 4px)}
  .leaflet-container{font-family:var(--sans);background:#e9eef3}
  .leaflet-control-attribution{font-size:10px}
  /* badge sulla mappa */
  .segno{width:0!important;height:0!important;background:none;border:0}
  .segno-in{position:absolute;left:0;bottom:0;transform:translate(-50%,-10px);display:flex;align-items:center;gap:6px;white-space:nowrap;
    background:var(--c);color:#fff;font-weight:700;font-size:13px;line-height:1;padding:7px 10px 7px 8px;border-radius:999px;border:2.5px solid #fff;
    box-shadow:0 4px 12px rgba(19,33,51,.35);cursor:pointer}
  .segno-in::after{content:'';position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:var(--c);border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;
    transform:translateX(-50%) rotate(45deg);border-radius:0 0 3px 0}
  .segno-in svg{font-size:17px;stroke-width:2.2}
  .segno-in.compatto{padding:9px;gap:0}
  .segno-in.compatto svg{font-size:19px}
  .segno-in i{font-style:normal;font-size:11px;font-weight:700;background:#fff;color:var(--c);border-radius:999px;padding:3px 7px;margin-left:2px}
  .segno.luogo .segno-in{background:#fff;color:var(--ink);border-color:var(--c)}
  .segno.luogo .segno-in::after{background:#fff;border-color:var(--c)}
  .segno.luogo .segno-in svg{color:var(--c)}


  /* animazione d'apertura: il tramonto dell'icona prende vita (circa 3,3 s, si salta con un tocco) */
  #alba{position:fixed;inset:0;z-index:100;background:#070a24;cursor:pointer;animation:a-via .6s ease 2.9s forwards}
  #alba svg{width:100%;height:100%;display:block;stroke:none}
  #alba svg.a-ramo-svg{position:absolute;top:calc(env(safe-area-inset-top) - 6px);left:0;width:62vw;max-width:340px;height:auto;overflow:visible}
  #alba .a-tramonto{opacity:0;animation:a-appare 1.8s ease-in-out .1s forwards}
  #alba .a-stelle circle{animation:a-brilla 1.6s ease-in-out infinite alternate}
  #alba .a-stelle{animation:a-stelle 2.4s ease forwards}
  #alba .a-sole{transform:translateY(190px);animation:a-sorge 2.2s cubic-bezier(.2,.7,.25,1) .15s forwards}
  #alba .a-alone{opacity:0;animation:a-appare 1.4s ease 1s forwards}
  #alba .a-nuvole{opacity:0;animation:a-nuvole 2.4s ease .8s forwards}
  #alba .a-ramo{transform-box:fill-box;transform-origin:0 0;animation:a-ondeggia 2.6s ease-in-out infinite alternate}
  #alba .a-petalo{opacity:0;transform:translate(var(--x),-40px) scale(var(--s));animation:a-cade var(--t) linear var(--d) forwards}
  #alba .a-titolo{position:absolute;left:0;right:0;top:24%;text-align:center;color:#fff;opacity:0;transform:translateY(12px);
    animation:a-titolo .9s ease 1.3s forwards;text-shadow:0 2px 18px rgba(20,10,60,.45)}
  #alba .a-titolo b{display:block;font-family:var(--disp);font-weight:800;font-size:2.4rem;letter-spacing:-.01em}
  #alba .a-titolo span{display:block;margin-top:6px;font-size:1rem;font-weight:500;opacity:.9}
  @keyframes a-appare{to{opacity:1}}
  @keyframes a-brilla{from{opacity:.25}to{opacity:1}}
  @keyframes a-stelle{0%{opacity:1}100%{opacity:.45}}
  @keyframes a-sorge{to{transform:translateY(0)}}

<script>
'use strict';
/* ====================================================================
   Giappone 2027 — app di viaggio condivisa.
   Pagina unica, nessuna dipendenza. I dati del viaggio sono cifrati nel
   file (blocco "seme") e nel cloud (Supabase, stessa tabella di CHO):
   senza il codice del viaggio nessuno li può leggere.
   ==================================================================== */
const VERSIONE = '2.8.0';
const CFG_KEY = 'g27-config', DATI_KEY = 'g27-dati', SEME_KEY = 'g27-seme';
const COLL = ['viaggiatori','tappe','giorni','alloggi','voli','luoghi','todo','budget','spese','info'];
const SEME = (() => { try{ return JSON.parse(document.getElementById('seme').textContent); }catch(e){ return {}; } })();

function leggiJSON(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function scriviJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
let cfg = leggiJSON(CFG_KEY) || {};
let D = leggiJSON(DATI_KEY);
let S = { animProssimo:true, altre:{}, sel:null, tab:'programma', aperto:null, sheet:null, citta:'tutte', cat:'tutti', soloPref:false,
  sync:{ stato:'', ora:null, errore:'' }, erroreBlocco:'', attesa:false, esitoImp:'' };
function salvaCfg(){ scriviJSON(CFG_KEY, cfg); }
function salvaLocale(){ if(!scriviJSON(DATI_KEY, D)) alert('Memoria del telefono piena: non riesco a salvare.'); }

/* ---------- utilità ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkOk = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
const maps = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const vis = k => ((D && D[k]) || []).filter(x => !x.del);
const trova = (k, id) => vis(k).find(x => x.id === id);
const oggiISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const giorniTra = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const fmtD = (iso, o) => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('it-IT', o || { day:'numeric', month:'long' }) : '';
const eur = n => '€ ' + Math.round(n).toLocaleString('it-IT');
const yen = n => '¥ ' + Math.round(n).toLocaleString('it-IT');
const cambio = () => Number(D.viaggio && D.viaggio.cambio) || 177;
const inEuro = s => s.valuta === 'JPY' ? Number(s.importo || 0) / cambio() : Number(s.importo || 0);
const io = () => cfg.io || '';
const nomeDi = id => { const p = trova('viaggiatori', id); return p ? p.nome : ''; };
const tappa = id => trova('tappe', id) || { citta:'', colore:'#888' };
const tappeNotte = () => vis('tappe').filter(t => !t.solo).sort((a, b) => a.dal.localeCompare(b.dal));

/* ---------- cifratura (stessa ricetta di CHO: PBKDF2 + AES-GCM) ---------- */
function _b64(buf){ const b = new Uint8Array(buf); let s = ''; for(let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function _unb64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function sha256hex(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
const normCodice = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
async function chiave(codice, salt, it){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normCodice(codice)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:it, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function cifra(testo, codice, it){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await chiave(codice, salt, it), new TextEncoder().encode(testo));
  return { v:1, it, salt:_b64(salt), iv:_b64(iv), ct:_b64(ct) };
}
async function decifra(o, codice){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:_unb64(o.iv) }, await chiave(codice, _unb64(o.salt), o.it || 100000), _unb64(o.ct));
  return new TextDecoder().decode(pt);
}

/* ---------- unione dei dati: per ogni elemento vince la modifica più recente ---------- */
function unisci(a, b){
  if(!a) return JSON.parse(JSON.stringify(b));
  if(!b) return a;
  const r = { viaggio: ((b.viaggio && b.viaggio.agg) || 0) > ((a.viaggio && a.viaggio.agg) || 0) ? b.viaggio : a.viaggio };
  for(const k of COLL){
    const m = new Map();
    for(const x of (a[k] || [])) m.set(x.id, x);
    for(const x of (b[k] || [])){ const y = m.get(x.id); if(!y || (x.agg || 0) > (y.agg || 0)) m.set(x.id, x); }
    r[k] = [...m.values()];
  }
  return r;
}
function firma(x){
  if(!x) return '';
  return ((x.viaggio && x.viaggio.agg) || 0) + '|' + COLL.map(k => (x[k] || []).map(r => r.id + ':' + (r.agg || 0)).sort().join(',')).join('|');
}
function salva(k, rec){
  rec.agg = Date.now(); rec.da = io();
  if(k === 'viaggio'){ D.viaggio = rec; }
  else{ const arr = D[k] || (D[k] = []); const i = arr.findIndex(x => x.id === rec.id); if(i >= 0) arr[i] = rec; else arr.push(rec); }
  salvaLocale(); pianificaSync();
}
function elimina(k, id){ const r = (D[k] || []).find(x => x.id === id); if(r){ salva(k, { id:r.id, del:true }); } }

/* ---------- seme cifrato contenuto nella pagina ---------- */
async function applicaSeme(codice){
  if(!SEME.ct) throw new Error('nessun dato nella pagina');
  const h = await sha256hex(SEME.ct + '|' + normCodice(codice));
  if(D && localStorage.getItem(SEME_KEY) === h) return;
  const seme = JSON.parse(await decifra(SEME, codice));
  D = unisci(D, seme); salvaLocale();
  try{ localStorage.setItem(SEME_KEY, h); }catch(e){}
}

/* ---------- sincronizzazione con Supabase ---------- */
let syncTimer = null, inSync = false, ancoraSync = false;
function pianificaSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(syncOra, 1500); aggiornaPill(); }
function syncAttiva(){ return !!(cfg.url && cfg.key && cfg.codice); }
async function syncOra(manuale){
  if(!syncAttiva()){ S.sync = { stato:'locale' }; aggiornaPill(); return; }
  if(inSync){ ancoraSync = true; return; }
  inSync = true; S.sync = { ...S.sync, stato:'corso' }; aggiornaPill();
  const base = cfg.url.trim().replace(/\/+$/, '') + '/rest/v1/' + (cfg.tabella || 'cho_sync');
  try{
    const id = await sha256hex('giappone-2027|' + normCodice(cfg.codice));
    const h = { apikey:cfg.key, Authorization:'Bearer ' + cfg.key };
    const r = await fetch(base + '?select=dati&codice=eq.' + id, { headers:h, cache:'no-store' });
    if(!r.ok) throw new Error('lettura non riuscita (' + r.status + ') ' + (await r.text()).slice(0, 140));
    const arr = await r.json();
    let remoto = null;
    if(arr.length){
      try{ remoto = JSON.parse(await decifra(JSON.parse(arr[0].dati), cfg.codice)); }
      catch(e){ throw new Error('i dati nel cloud non si aprono con questo codice'); }
    }
    const prima = firma(D);
    D = unisci(D, remoto); salvaLocale();
    if(!remoto || firma(D) !== firma(remoto)){
      const bundle = JSON.stringify(await cifra(JSON.stringify(D), cfg.codice, 150000));
      const p = await fetch(base, { method:'POST', headers:{ ...h, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify([{ codice:id, dati:bundle, aggiornato:new Date().toISOString() }]) });
      if(!p.ok) throw new Error('invio non riuscito (' + p.status + ') ' + (await p.text()).slice(0, 140));
    }
    S.sync = { stato:'ok', ora:Date.now() };
    if(prima !== firma(D)) renderSicuro(); else aggiornaPill();
  }catch(e){
    S.sync = { stato:'errore', errore:(e && e.message) || String(e) };
    aggiornaPill();
    if(manuale) S.esitoImp = 'Sincronizzazione non riuscita: ' + S.sync.errore;
  }finally{
    inSync = false;
    if(ancoraSync){ ancoraSync = false; setTimeout(syncOra, 400); }
    if(manuale && S.sheet && S.sheet.tipo === 'impostazioni') render();
  }
}
function aggiornaPill(){ const el = document.getElementById('pill'); if(el) el.innerHTML = pillHTML(); }
function renderSicuro(){
  const a = document.activeElement;
  if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ aggiornaPill(); S.renderInSospeso = true; return; }
  render();
}

/* ---------- invito: #c=CODICE&u=URL&k=CHIAVE&t=TABELLA ---------- */
function leggiInvito(){
  if(!location.hash || location.hash.length < 4) return;
  const p = new URLSearchParams(location.hash.slice(1));
  if(p.get('c')){
    cfg.codice = normCodice(p.get('c'));
    if(p.get('u')) cfg.url = p.get('u');
    if(p.get('k')) cfg.key = p.get('k');
    if(p.get('t')) cfg.tabella = p.get('t');
    salvaCfg();
  }
  history.replaceState(null, '', location.pathname + location.search);
}
function linkInvito(){
  const p = new URLSearchParams({ c:cfg.codice });
  if(cfg.url && cfg.key){ p.set('u', cfg.url); p.set('k', cfg.key); if(cfg.tabella && cfg.tabella !== 'cho_sync') p.set('t', cfg.tabella); }
  return location.origin + location.pathname + '#' + p.toString();
}

/* ---------- mappa (Leaflet + OpenStreetMap/CARTO) ---------- */
const CENTRI = { tutte:[[35.4, 137.3], 6], osaka:[[34.675, 135.502], 13], nara:[[34.685, 135.832], 14], kyoto:[[35.006, 135.765], 13],
  tokyo:[[35.69, 139.76], 12] };
let MAPPA = null, STRATO = null, ULTIMA_CITTA = null;
function creaMappa(){
  if(!window.L) return false;
  MAPPA = L.map('mappa', { zoomControl:false, attributionControl:true, tap:true }).setView(CENTRI.tutte[0], CENTRI.tutte[1]);
  // Sfondo chiaro Esri (gratuito, senza chiave): base grigio chiaro + nomi in inglese, senza svincoli né cartelli.
  // Se non risponde passa alla mappa stradale Esri, poi a OpenStreetMap.
  const ESRI = n => `https://server.arcgisonline.com/ArcGIS/rest/services/${n}/MapServer/tile/{z}/{y}/{x}`;
  const base = L.tileLayer(ESRI('Canvas/World_Light_Gray_Base'), { maxZoom:19, maxNativeZoom:16, attribution:'&copy; Esri, OpenStreetMap' }).addTo(MAPPA);
  const nomi = L.tileLayer(ESRI('Canvas/World_Light_Gray_Reference'), { maxZoom:19, maxNativeZoom:16, pane:'overlayPane' }).addTo(MAPPA);
  let errori = 0;
  const ripiego = () => {
    if(++errori < 4 || !MAPPA.hasLayer(base)) return;
    MAPPA.removeLayer(base); MAPPA.removeLayer(nomi);
    const strade = L.tileLayer(ESRI('World_Street_Map'), { maxZoom:19, maxNativeZoom:18, attribution:'&copy; Esri, OpenStreetMap' }).addTo(MAPPA);
    let e2 = 0, ok = 0;
    strade.on('tileload', () => ok++);
    strade.on('tileerror', () => { if(++e2 < 4 || ok > 0 || !MAPPA.hasLayer(strade)) return;
      MAPPA.removeLayer(strade);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(MAPPA); });
  };
  base.on('tileerror', ripiego); nomi.on('tileerror', ripiego);
  L.control.zoom({ position:'bottomleft' }).addTo(MAPPA);
  STRATO = L.layerGroup().addTo(MAPPA);
  MAPPA.on('zoomend', disegnaSegni);
  MAPPA.on('click', e => {
    if(!S.puntoNuovo) return;
    S.puntoNuovo = false;
    const lat = +e.latlng.lat.toFixed(6), lon = +e.latlng.lng.toFixed(6);
    if(S.sposta){
      const r = trova('luoghi', S.sposta); S.sposta = null;
      if(r){ salva('luoghi', { ...r, lat, lon, tappa: tappaVicina(lat, lon) }); S.sheet = { tipo:'dett', k:'luoghi', id:r.id }; }
    }else S.sheet = { k:'luoghi', base:{ lat, lon, tappa:tappaVicina(lat, lon), cat:'vedere' } };
    render();
  });
  return true;
}
function tappaVicina(lat, lon){
  let best = 'tokyo', d = 1e9;
  for(const [k, [[a, b]]] of Object.entries(CENTRI)){ if(k === 'tutte') continue; const x = (a - lat) ** 2 + (b - lon) ** 2; if(x < d){ d = x; best = k; } }
  return best;
}
const breve = n => n.length > 20 ? n.slice(0, 18).trim() + '…' : n;
function segno(rec, tipo, compatto){
  const t = tappa(rec.tappa);
  let col = t.colore || '#0f8f9a', icona = 'letto', extra = '';
  if(tipo === 'alloggi'){
    if(rec.stato === 'prenotato'){ col = '#2e9e5b'; extra = '<i>prenotato</i>'; }
    else if(rec.stato === 'scelto'){ col = '#2f77d6'; extra = '<i>scelto</i>'; }
  }else{ const c = CAT[rec.cat] || CAT.altro; icona = c[0]; col = getComputedStyle(document.documentElement).getPropertyValue(c[2].slice(4, -1)).trim() || col; }
  const m = L.marker([rec.lat, rec.lon], { icon:L.divIcon({ className:'segno' + (tipo === 'luoghi' ? ' luogo' : ''),
    html:compatto ? `<div class="segno-in compatto" style="--c:${esc(col)}">${ic(icona)}</div>`
      : `<div class="segno-in" style="--c:${esc(col)}">${ic(icona)}<span>${esc(breve(rec.nome))}</span>${extra}</div>`, iconSize:[0, 0], iconAnchor:[0, 0] }),
    riseOnHover:true, zIndexOffset:tipo === 'alloggi' ? 500 : 0 });
  m.on('click', () => { S.sheet = { tipo:'dett', k:tipo, id:rec.id }; render(); });
  return m;
}
const conPos = r => r.lat !== '' && r.lat != null && isFinite(r.lat) && isFinite(r.lon);
/* da lontano un badge per città; a metà zoom segnaposto compatti; da vicino badge con il nome */
function disegnaSegni(){
  const hotel = hotelScelti().filter(conPos), luoghi = vis('luoghi').filter(conPos);
  if(!STRATO) return { hotel, luoghi };
  STRATO.clearLayers();
  const z = MAPPA.getZoom();
  if(z < 10){
    for(const t of tappeNotte()){
      const h = hotel.filter(r => r.tappa === t.id), l = luoghi.filter(r => r.tappa === t.id);
      if(!h.length && !l.length) continue;
      const tutti = [...h, ...l], lat = tutti.reduce((a, r) => a + r.lat, 0) / tutti.length, lon = tutti.reduce((a, r) => a + r.lon, 0) / tutti.length;
      const testo = [h.length && h.length + ' hotel', l.length && l.length + (l.length === 1 ? ' luogo' : ' luoghi')].filter(Boolean).join(' · ');
      const m = L.marker([lat, lon], { icon:L.divIcon({ className:'segno', iconSize:[0, 0], iconAnchor:[0, 0],
        html:`<div class="segno-in" style="--c:${esc(t.colore)}">${ic('pin')}<span>${esc(t.citta)}</span><i>${testo}</i></div>` }) });
      m.on('click', () => { S.citta = t.id; render(); });
      STRATO.addLayer(m);
    }
  }else{
    const compatto = z < 14;
    hotel.forEach(h => STRATO.addLayer(segno(h, 'alloggi', compatto)));
    luoghi.forEach(l => STRATO.addLayer(segno(l, 'luoghi', compatto)));
  }
  return { hotel, luoghi };
}

  MAPPA.invalidateSize();

  const citta = ['tutte', ...tappeNotte().map(t => t.id)];
  document.getElementById('mappa-filtri').innerHTML = citta.map(c =>
    `<button class="${S.citta === c ? 'on' : ''}" data-a="citta" data-v="${c}">${c === 'tutte' ? 'Tutto il Giappone' : esc(tappa(c).citta)}</button>`).join('');
  document.getElementById('mappa-piu').innerHTML = ic('piu');
  document.getElementById('mappa-aiuto').hidden = !S.puntoNuovo;

  document.getElementById('mappa-piu').hidden = !!S.puntoNuovo;
  const { hotel, luoghi } = disegnaSegni();
  if(ULTIMA_CITTA !== S.citta){
    ULTIMA_CITTA = S.citta;
    const punti = [...hotel, ...luoghi].filter(r => S.citta === 'tutte' || r.tappa === S.citta).map(r => [r.lat, r.lon]);
    if(S.citta !== 'tutte' && punti.length > 1) MAPPA.flyToBounds(L.latLngBounds(punti).pad(.25), { duration:.8, maxZoom:16 });
    else{ const [c, z] = CENTRI[S.citta] || CENTRI.tutte; MAPPA.flyTo(c, z, { duration:.8 }); }
  }
}

const FUSI = [['it', 'Italia', 'Europe/Rome'], ['jp', 'Giappone', 'Asia/Tokyo']];
function oraIn(tz){
  const d = new Date(), p = {};
  for(const x of new Intl.DateTimeFormat('it-IT', { hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23', timeZone:tz }).formatToParts(d)) p[x.type] = x.value;
  return { h:p.hour, m:p.minute, s:p.second,
    giorno: d.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'short', timeZone:tz }) };
}
function orologiHTML(){
  return `<div class="orologi">${FUSI.map(([k, nome, tz]) => { const o = oraIn(tz);
    return `<div class="quadrante ${k}"><div class="q-nome">${nome}</div>
      <div class="q-schermo"><span class="q-ora"><b id="oh-${k}">${o.h}</b><i class="q-punti">:</i><b id="om-${k}">${o.m}</b></span></div>

}
function aggiornaOrologi(){

function compagniaDi(v){
  if(linkOk(v.sitoCompagnia)) return [v.compagnia || 'compagnia aerea', linkOk(v.sitoCompagnia)];
  const cod = String(v.numero || '').toUpperCase().replace(/\s+/g, '').slice(0, 2);
  if(COMPAGNIE[cod]) return COMPAGNIE[cod];
  const nome = String(v.compagnia || '').toLowerCase().trim();

  return Object.values(COMPAGNIE).find(([n]) => n.toLowerCase().includes(nome) || nome.includes(n.toLowerCase())) || null;
}

        <button class="btn ${r.visto ? 'maps' : ''}" data-a="visto" data-id="${id}">${ic('ok')}${r.visto ? 'Già visto' : 'Fatto'}</button>
        ${u ? `<a class="btn full2" href="${esc(u)}" target="_blank" rel="noopener">${ic('link')}Sito web</a>` : ''}
        <button class="btn full2" data-a="spostaLuogo" data-id="${id}">${ic('pin')}${conPos(r) ? 'Sposta sulla mappa' : 'Metti sulla mappa'}</button></div>
      ${chi.length ? `<p class="nota-pie">Piace a: ${chi.map(p => esc(nomeDi(p))).join(', ')}</p>` : ''}
      ${modifica}`;
  }
  if(k === 'alloggi'){
    const u = linkOk(r.link), att = /^attenzione/i.test(r.note || ''), chi = quantiCuori(r);
    return `${testaFoglio(esc(r.nome))}
      <p class="sottotitolo" style="margin-top:-6px">${esc(tappa(r.tappa).citta)} · ${esc(r.camera || '')}</p>
      ${azioniMaps(r, r.nome + ' ' + tappa(r.tappa).citta)}
      <div style="height:12px"></div>
      ${att ? `<div class="avviso">${ic('allerta')}<span>${esc(r.note)}</span></div>` : ''}
      ${r.rimborsabile || r.conferma ? `<div class="blocco">${r.rimborsabile ? `<p style="color:var(--muted)">Cancellazione gratuita fino al <b style="color:var(--ink)">${fmtD(r.rimborsabile, { day:'numeric', month:'long', year:'numeric' })}</b></p>` : ''}
        ${r.conferma ? `<p style="margin-top:6px;color:var(--muted)">Codice di prenotazione: <b style="color:var(--ink)">${esc(r.conferma)}</b></p>` : ''}</div>` : ''}
      <div class="etichetta" style="margin:4px 2px 8px">A che punto siamo</div>
      <div class="stati">${[['scelto','Scelto'], ['prenotato','Prenotato']].map(([s, t]) =>
        `<button class="${r.stato === s ? 'on ' + s : ''}" data-a="statoH" data-id="${id}" data-v="${s}">${t}</button>`).join('')}</div>
      ${r.note && !att ? `<div class="blocco" style="margin-top:12px"><p>${esc(r.note)}</p></div>` : ''}
      <div class="bottoni">
        <button class="btn ${haCuore(r) ? 'maps' : ''}" data-a="pref" data-k="alloggi" data-id="${id}">${ic('cuore')}${haCuore(r) ? 'Preferito' : 'Preferito?'}</button>
        ${u ? `<a class="btn full2" href="${esc(u)}" target="_blank" rel="noopener">${ic('link')}Sito dell'hotel</a>` : ''}</div>
      ${chi.length ? `<p class="nota-pie">Piace a: ${chi.map(p => esc(nomeDi(p))).join(', ')}</p>` : ''}
      ${modifica}`;
  }
  if(k === 'voli'){
    const ora = s => s ? s.slice(11, 16) : '—';
    const righe = [['Compagnia', [r.compagnia, r.numero].filter(Boolean).join(' ')], ['Terminal', r.terminal], ['Prenotazione', r.prenotazione], ['Bagaglio', r.bagaglio], ['Note', r.note]].filter(x => x[1]);
    return `${testaFoglio(r.tipo === 'ritorno' ? 'Volo di ritorno' : r.tipo === 'andata' ? 'Volo di andata' : 'Volo')}
      <p class="sottotitolo" style="margin-top:-6px">${fmtD(r.data, { weekday:'long', day:'numeric', month:'long', year:'numeric' })}</p>
      <div class="blocco" style="display:flex;gap:12px">
        <div style="flex:1"><div class="etichetta">Partenza</div><p><b>${esc(r.origine)}</b></p><div class="titolo num" style="margin:4px 0 0;font-size:1.5rem">${ora(r.partenza)}</div></div>
        <div style="flex:1;text-align:right"><div class="etichetta">Arrivo</div><p><b>${esc(r.destinazione)}</b></p><div class="titolo num" style="margin:4px 0 0;font-size:1.5rem">${ora(r.arrivo)}${r.arrivo && r.partenza && r.arrivo.slice(0, 10) > r.partenza.slice(0, 10) ? '<sup style="font-size:.55em;color:var(--muted)"> +1</sup>' : ''}</div></div></div>
      ${righe.length ? `<div class="blocco">${righe.map(([e, v]) => `<div class="etichetta" style="margin-top:8px">${e}</div><p>${esc(v)}</p>`).join('')}</div>`
        : `<div class="blocco"><p style="color:var(--muted)">Quando avete i biglietti, tocca Modifica e aggiungi compagnia, numero del volo e orari.</p></div>`}
      ${(() => { const c = compagniaDi(r); return c ? `<div style="margin-bottom:12px">${ext(c[1], 'primary full', ic('aereo') + 'Apri il sito di ' + esc(c[0]))}</div>` : ''; })()}
      ${r.numero ? `<div class="etichetta" style="margin:4px 2px 8px">Stato del volo in tempo reale</div>
        <div class="bottoni" style="margin-top:0">${ext('https://www.google.com/search?q=' + encodeURIComponent('volo ' + [r.compagnia, r.numero].filter(Boolean).join(' ')), 'maps', ic('aereo') + 'Stato su Google')}
        ${ext('https://www.flightradar24.com/data/flights/' + encodeURIComponent(String(r.numero).replace(/\s+/g, '').toLowerCase()), '', ic('mappa') + 'Flightradar24')}</div>` : ''}
      ${modifica}`;
  }
  if(k === 'info') return `${testaFoglio(esc(r.titolo))}<div class="blocco"><p style="white-space:pre-line">${esc(r.testo)}</p></div>${modifica}`;
  return testaFoglio('');
}

/* modifica di un giorno */
function foglioGiorno(){
  const b = S.sheet.bozza, L = vis('luoghi');
  const ordinati = L.slice().sort((x, y) => (x.tappa === b.tappa ? 0 : 1) - (y.tappa === b.tappa ? 0 : 1) || x.nome.localeCompare(y.nome));
  return `${testaFoglio(S.sheet.id ? 'Modifica giorno' : 'Nuovo giorno')}
    <div class="due"><label class="campo"><span>Data</span><input type="date" data-bz="data" value="${esc(b.data)}"></label>
      <label class="campo"><span>Città</span><select data-bz="tappa">${opzTappe().map(([k, t]) => `<option value="${k}" ${b.tappa === k ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label></div>
    <label class="campo"><span>Titolo</span><input data-bz="titolo" value="${esc(b.titolo)}"></label>
    <div class="sec" style="margin-top:10px">Attività</div>
    ${b.voci.map((x, i) => `<div class="voce-ed"><div class="riga-ed">
        <input placeholder="Orario (es. 9:00)" data-bz="voci.${i}.ora" value="${esc(x.ora)}">
        <button class="mini" data-a="voceSu" data-i="${i}" ${i ? '' : 'disabled'} aria-label="Sposta su">${ic('freccia')}</button>
        <button class="mini" data-a="voceVia" data-i="${i}" aria-label="Togli">${ic('x')}</button></div>
      <textarea placeholder="Cosa si fa" data-bz="voci.${i}.t">${esc(x.t)}</textarea>
      <select data-bz="voci.${i}.l"><option value="">Nessun luogo sulla mappa</option>${ordinati.map(l =>
        `<option value="${l.id}" ${x.l === l.id ? 'selected' : ''}>${esc(l.nome)} (${esc(tappa(l.tappa).citta)})</option>`).join('')}</select>
      <input class="link" placeholder="Link (facoltativo)" type="url" data-bz="voci.${i}.u" value="${esc(x.u || '')}"></div>`).join('')}
    <button class="btn full" data-a="voceNuova">${ic('piu')}Aggiungi attività</button>
    <button class="btn primary full" style="margin-top:12px" data-a="salvaGiorno">Salva</button>
    ${S.sheet.id ? `<button class="btn danger full" style="margin-top:10px" data-a="eliminaGiorno">Elimina giorno</button>` : ''}`;
}

/* =========================== AZIONI =========================== */
const A = {
  tab(d){ S.tab = d.v; S.animProssimo = true; render(); window.scrollTo(0, 0); },
  sync(){ syncOra(true); },
  async sblocca(){
    const c = normCodice(document.getElementById('codice-in').value);
    if(c.length < 8){ S.erroreBlocco = 'Il codice è troppo corto.'; render(); return; }
    S.attesa = true; S.erroreBlocco = ''; render();
    try{ await applicaSeme(c); cfg.codice = c; salvaCfg(); S.attesa = false; render(); syncOra(); }
    catch(e){ S.attesa = false; S.erroreBlocco = 'Codice non corretto.'; render(); }
  },
  apriGiorno(d){ S.sheet = { tipo:'giornoVista', id:d.id }; render(); },
  sonoIo(d){
    cfg.io = d.id; salvaCfg();
    const dopo = S.sheet && S.sheet.dopo, prima = S.sheet && S.sheet.prima;
    S.sheet = prima || null;
    if(dopo) A.pref(dopo); else render();
  },
  dett(d){ S.sheet = { tipo:'dett', k:d.k, id:d.id }; render(); },
  altre(d){ S.altre[d.v] = true; render(); },
  filtro(d){ S[d.f] = d.v; render(); },
  citta(d){ S.citta = d.v; render(); },
  nuovoPunto(){ S.puntoNuovo = true; S.sposta = null; S.sheet = null; window.scrollTo({ top:0, behavior:'smooth' }); render(); },
  annullaPunto(){ S.puntoNuovo = false; S.sposta = null; render(); },
  spostaLuogo(d){ S.sposta = d.id; S.puntoNuovo = true; S.sheet = null; window.scrollTo({ top:0, behavior:'smooth' }); render(); },
  vediLuogo(d){
    const r = trova('luoghi', d.id);
    if(r && conPos(r) && MAPPA){ MAPPA.flyTo([r.lat, r.lon], Math.max(MAPPA.getZoom(), 15), { duration:.6 }); window.scrollTo({ top:0, behavior:'smooth' }); }
    S.sheet = { tipo:'dett', k:'luoghi', id:d.id }; render();
  },
  pref(d){
    if(!io()){ S.sheet = { tipo:'chiSei', dopo:{ k:d.k, id:d.id }, prima:S.sheet }; render(); return; }
    const r = JSON.parse(JSON.stringify(trova(d.k, d.id))); r.pref = r.pref || {}; r.pref[io()] = !r.pref[io()];
    salva(d.k, r); render();
  },
  visto(d){ const r = { ...trova('luoghi', d.id) }; r.visto = !r.visto; salva('luoghi', r); render(); },
  todo(d){ const r = { ...trova('todo', d.id) }; r.fatto = !r.fatto; salva('todo', r); render(); },
  statoH(d){ const r = { ...trova('alloggi', d.id) }; r.stato = d.v; salva('alloggi', r); render(); },
  nuovo(d){
    const base = d.k === 'spese' ? { valuta: oggiISO() >= D.viaggio.partenza ? 'JPY' : 'EUR', data: oggiISO(), chi: io(), cat: (vis('budget')[1] || {}).id }
      : d.k === 'luoghi' ? { tappa: S.citta !== 'tutte' ? S.citta : '', cat: S.cat !== 'tutti' ? S.cat : 'vedere' } : {};
    S.sheet = { k:d.k, base }; render();
  },
  mod(d){ S.sheet = { k:d.k, id:d.id }; render(); },
  chiudi(){ S.sheet = null; S.esitoImp = ''; render(); },
  sfondo(d, e){ if(e.target.classList.contains('velo')) A.chiudi(); },
  salvaModulo(){
    const f = document.getElementById('modulo'); if(!f.reportValidity()) return;
    const sh = S.sheet, sc = SCHEMI[sh.k], rec = sh.id ? { ...trova(sh.k, sh.id) } : { id: uid(sh.k[0]) };
    for(const c of sc.campi){ let v = f.elements[c.k].value.trim(); if(c.t === 'num' || c.t === 'hidden' && (c.k === 'lat' || c.k === 'lon')) v = v === '' ? '' : Number(v.replace(',', '.')); rec[c.k] = v; }
    if(sh.k === 'luoghi' && !rec.q) rec.q = isFinite(rec.lat) && rec.lat !== '' ? rec.lat + ',' + rec.lon : rec.nome + ' ' + tappa(rec.tappa).citta;
    if(sh.k === 'todo' && rec.fatto == null) rec.fatto = false;
    salva(sh.k, rec); S.sheet = null; render();
  },
  eliminaModulo(){ if(!confirm('Eliminare per tutti?')) return; elimina(S.sheet.k, S.sheet.id); S.sheet = null; render(); },
  modGiorno(d){ const g = trova('giorni', d.id); S.sheet = { tipo:'giorno', id:d.id, bozza: JSON.parse(JSON.stringify({ ...g, voci: g.voci || [] })) }; render(); },
  nuovoGiorno(){
    const ult = vis('giorni').map(g => g.data).sort().pop() || D.viaggio.partenza;
    const data = new Date(Date.parse(ult + 'T12:00:00') + 864e5).toISOString().slice(0, 10);
    S.sheet = { tipo:'giorno', bozza:{ data, tappa:(tappaDellaNotte(ult) || {}).id || '', titolo:'', voci:[{ ora:'', t:'' }], note:'' } }; render();
  },
  voceNuova(){ S.sheet.bozza.voci.push({ ora:'', t:'' }); render(); },
  voceVia(d){ S.sheet.bozza.voci.splice(+d.i, 1); render(); },
  voceSu(d){ const v = S.sheet.bozza.voci, i = +d.i; if(i > 0){ [v[i - 1], v[i]] = [v[i], v[i - 1]]; render(); } },
  salvaGiorno(){
    const b = S.sheet.bozza; if(!b.titolo.trim()){ alert('Scrivi un titolo.'); return; }
    b.voci = b.voci.filter(v => (v.t || '').trim()).map(v => { const o = { ora:(v.ora || '').trim(), t:v.t.trim() }; if(v.l) o.l = v.l; if(linkOk(v.u)) o.u = linkOk(v.u); return o; });
    if(!b.id) b.id = uid('g');
    salva('giorni', b); S.sheet = { tipo:'giornoVista', id:b.id }; render();
  },
  eliminaGiorno(){ if(!confirm('Eliminare questo giorno per tutti?')) return; elimina('giorni', S.sheet.id); S.sheet = null; render(); },
  impostazioni(){ S.sheet = { tipo:'impostazioni' }; S.esitoImp = ''; render(); },
  nuovoViaggiatore(){ salva('viaggiatori', { id: uid('p'), nome:'Nuovo viaggiatore' }); render(); },
  syncManuale(){ if(!syncAttiva()){ S.esitoImp = 'Inserisci Project URL e chiave anon di Supabase.'; render(); return; } S.esitoImp = 'Sincronizzo…'; render();
    syncOra(true).then(() => { if(S.sync.stato === 'ok'){ S.esitoImp = 'Sincronizzato alle ' + new Date().toLocaleTimeString('it-IT'); render(); } }); },
  async invita(){
    const url = linkInvito();
    const testo = 'Ecco l’app del nostro viaggio in Giappone. Aprila dal telefono e aggiungila alla schermata Home: ' + url;
    if(!syncAttiva()) S.esitoImp = 'Attenzione: senza Supabase configurato i compagni vedono il programma ma non le modifiche degli altri.';
    try{ if(navigator.share){ await navigator.share({ title:'Giappone 2027', text:testo }); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
    try{ await navigator.clipboard.writeText(url); S.esitoImp = 'Link copiato: incollalo in un messaggio privato.'; }
    catch(e){ prompt('Copia questo link:', url); }
    render();
  },
  esporta(){
    const blob = new Blob([JSON.stringify({ app:'giappone-2027', versione:VERSIONE, dati:D }, null, 1)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'giappone-2027-' + oggiISO() + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  importa(){
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = () => { const f = inp.files[0]; if(!f) return; f.text().then(t => {
      try{ const o = JSON.parse(t); if(o.app !== 'giappone-2027' || !o.dati) throw 0; D = unisci(D, o.dati); salvaLocale(); pianificaSync(); S.esitoImp = 'Copia importata e unita ai dati.'; render(); }
      catch(e){ alert('Il file non è una copia di questa app.'); } }); };
    inp.click();
  },
  esci(){
    if(!confirm('Cancellare i dati del viaggio da questo telefono? Restano nel cloud e negli altri telefoni.')) return;
    [CFG_KEY, DATI_KEY, SEME_KEY].forEach(k => localStorage.removeItem(k));
    cfg = {}; D = null; S.sheet = null; render();
  },
  csv(){
    const q = s => '"' + String(s || '').replace(/"/g, '""') + '"';
    const righe = [['Nome','Indirizzo','Città','Tipo','Note','Sito']].concat(vis('luoghi').map(l =>
      [l.nome, l.q || l.nome, tappa(l.tappa).citta, (CAT[l.cat] || CAT.altro)[1], l.note, l.link]));
    const blob = new Blob(['﻿' + righe.map(r => r.map(q).join(',')).join('\n')], { type:'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'luoghi-giappone-2027.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
};

/* Salvataggio dei campi modificabili. Su iPhone toccare un pulsante spesso non
   toglie il fuoco alla casella, quindi l'evento "change" può non arrivare mai:
   si salva mentre si scrive (con un attimo di ritardo) e comunque prima di ogni tocco. */
function salvaCampo(el){
  if(!el || !el.dataset) return false;
  if(el.dataset.ed){
    const [k, id, campo] = el.dataset.ed.split('|');
    let v = el.value; if(el.type === 'number') v = Number(v) || '';
    if(k === 'viaggio'){ if(D.viaggio[campo] !== v){ salva('viaggio', { ...D.viaggio, [campo]: v }); return true; } }
    else{ const r = trova(k, id); if(r && r[campo] !== v){ salva(k, { ...r, [campo]: v }); return true; } }
  }
  if(el.dataset.cfg){
    const v = el.value.trim();
    if(cfg[el.dataset.cfg] !== v){ cfg[el.dataset.cfg] = v; salvaCfg(); return true; }
  }
  return false;
}
let attesaCampo = null;
function salvaCampoAttivo(){
  clearTimeout(attesaCampo);
  const a = document.activeElement;
  return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) ? salvaCampo(a) : false;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  if(b.dataset.a === 'sfondo' && b !== e.target) return;
  salvaCampoAttivo();
  const f = A[b.dataset.a]; if(f){ e.preventDefault(); f(b.dataset, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.bz && S.sheet && S.sheet.bozza){
    const p = el.dataset.bz.split('.'); let o = S.sheet.bozza;
    while(p.length > 1) o = o[p.shift()];
    o[p[0]] = el.value;
  }
  if(el.dataset.ed || el.dataset.cfg){ clearTimeout(attesaCampo); attesaCampo = setTimeout(() => salvaCampo(el), 600); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(!(el.dataset.ed || el.dataset.cfg)) return;
  clearTimeout(attesaCampo);
  salvaCampo(el);
  if(el.dataset.cfg === 'io' || (el.dataset.ed && S.sheet && S.sheet.tipo !== 'impostazioni')) render();
});
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') salvaCampoAttivo(); });
window.addEventListener('pagehide', salvaCampoAttivo);
document.addEventListener('focusout', () => setTimeout(() => {
  const a = document.activeElement;
  if(S.renderInSospeso && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) render();
}, 50));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && cfg.codice && D) syncOra(); });
setInterval(() => { if(document.visibilityState === 'visible' && cfg.codice && D && !inSync) syncOra(); }, 60000);

(async function avvio(){
  const alba = document.getElementById('alba');
  if(alba){ const via = () => alba.remove(); alba.addEventListener('click', via); setTimeout(via, 3600); }
  leggiInvito();
  if(cfg.codice){
    try{ await applicaSeme(cfg.codice); }
    catch(e){ if(!D){ S.erroreBlocco = 'Il codice salvato non apre i dati: inseriscilo di nuovo.'; cfg.codice = ''; salvaCfg(); } }
  }
  render();
  if(cfg.codice && D) syncOra();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
